<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78716c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a8a29e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#57534e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="overlay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#overlay)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="40" fill="#fbbf24" opacity="0.2"/>
  <circle cx="1100" cy="530" r="60" fill="#f59e0b" opacity="0.15"/>
  <rect x="50" y="300" width="80" height="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="1070" y="200" width="100" height="2" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Main Content -->
  <g transform="translate(100, 150)">
    <!-- Title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
      Monxoros Expedition
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#f3f4f6">
      Photography Workshop in Northeast Brazil
    </text>
    
    <!-- Description -->
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="24" fill="#d1d5db">
      7-Day Exclusive Journey • 5 Photographers Only
    </text>
    
    <!-- Date -->
    <text x="0" y="180" font-family="Arial, sans-serif" font-size="20" fill="#fbbf24">
      March 15-21, 2025
    </text>
    
    <!-- Website -->
    <text x="0" y="240" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">
      monxorosexpedition.com
    </text>
  </g>
  
  <!-- Camera Icon -->
  <g transform="translate(950, 400)">
    <rect x="0" y="20" width="120" height="80" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="60" cy="60" r="25" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="60" cy="60" r="15" fill="#fbbf24" opacity="0.3"/>
    <rect x="20" y="10" width="20" height="15" rx="3" fill="#fbbf24"/>
    <rect x="100" y="35" width="15" height="8" rx="2" fill="#fbbf24"/>
  </g>
</svg>